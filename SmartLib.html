<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLib</title>
    <link rel="stylesheet" href="SmartLib.css">
</head>
<body>

    <div class="navbar">
        <h1>SmartLib</h1>
    </div>

    <!-- Books will appear here ONLY via JS -->
    <div class="container"></div>

    <!-- Popup -->
    <div class="popup-overlay"></div>
    <div class="popup-box">
        <h2>Add Book</h2>
        <form>
            <input type="text" placeholder="Book Title" id="book-title">
            <input type="text" placeholder="Book Author" id="book-author">
            <textarea placeholder="Short Description" id="book-description"></textarea>
            <button id="add-book">ADD</button>
            <button id="cancel-popup">CANCEL</button>
        </form>
    </div>

    <!-- Plus button -->
    <button class="add-button" id="add-popup-button">+</button>

    <script src="SmartLib.js"></script>
</body>
</html>
