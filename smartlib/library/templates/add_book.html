<h2>Add Book</h2>

<form method="POST">
    {% csrf_token %}
    
    <label>Book Title</label><br>
    {{ form.title }}<br><br>

    <label>Book Author</label><br>
    {{ form.author }}<br><br>

    <label>Short Description</label><br>
    {{ form.description }}<br><br>

    <button type="submit">ADD</button>
    <a href="/">CANCEL</a>
</form>
