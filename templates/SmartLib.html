<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLib</title>

    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
        }

        .navbar {
            background: linear-gradient(90deg, #4CAF50, #2E7D32);
            padding: 15px;
            text-align:center;
        }

        .container {
            margin: 20px;
        }

        .book {
            background: #f4f4f4;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow:0px 2px 8px rgba(0,0,0,0.1)
        }

        .container{
            margin: 20px;
        }
        .book {
            background: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        .book h3 {
            margin: 0;
            color: #333;
        }

        .book p {
            margin: 5px 0;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: darkred;
        }

        .add-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 28px;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 50%;
            cursor: pointer;
        }

        .popup-overlay {
            display: none;
            position: fixed;
            background: rgba(0,0,0,0.5);
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .popup-box {
            display: none;
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
            position: fixed;
            top: 30%;
            left: 40%;
        }
        input, textarea{
            width: 100%;
        padding:8px;
        }
        button{
            margin-top: 5px;;
        }
    </style>
</head>
<body>

<div class="navbar">
    <h1>SmartLib</h1>
</div>

<!-- ✅ STEP 6: SHOW BOOKS FROM DATABASE -->
<div class="container">
    {% for book in books %}
        <div class="book">
            <h3>{{ book.title }}</h3>
            <p><b>{{ book.author }}</b></p>
            <p>{{ book.description }}</p>
            <a href = "{% url 'delete_book' book.id %}">
                <button class = "delete-btn">Delete</button>
            </a>
            <a href="{% url 'update_book' book.id %}">
                <button style="background:orange;color:white;">Edit</button>
            </a>
        </div>
    {% empty %}
        <p>No books added yet</p>
    {% endfor %}
</div>

<!-- Popup -->
<div class="popup-overlay" id="overlay"></div>

<div class="popup-box" id="popup">
    <h2>Add Book</h2>

    <!-- ✅ STEP 5: DJANGO FORM -->
    <form method="POST" action="/add/">
        {% csrf_token %}

        <input type="text" name="title" placeholder="Book Title" required><br><br>
        <input type="text" name="author" placeholder="Book Author" required><br><br>
        <textarea name="description" placeholder="Short Description" required></textarea><br><br>

        <button type="submit">ADD</button>
        <button type="button" onclick="closePopup()">CANCEL</button>
    </form>
</div>

<button class="add-button" onclick="openPopup()">+</button>

<script>
function openPopup() {
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
    document.getElementById("overlay").style.display = "none";
}
</script>

</body>
</html>
